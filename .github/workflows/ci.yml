name: CI

on:
  push:
    branches: [dev, test-tiny]
  pull_request:
    branches: [dev]

env:
  BUN_VERSION: 1.4.x

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint (errors block; warnings are tolerated for legacy code)
        run: bunx eslint packages --ext .ts,.tsx,.js,.cjs,.mjs

  typecheck:
    name: Typecheck (focused)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck core packages (focused to avoid OOM)
        run: |
          pkg_failed=""
          for pkg in anymous core cli server tui schema protocol script plugin llm codemode; do
            echo "=== Typechecking packages/$pkg ==="
            if [ -f "packages/$pkg/tsconfig.json" ]; then
              bunx --bun tsgo -p packages/$pkg/tsconfig.json --noEmit || pkg_failed="$pkg_failed $pkg"
            fi
          done
          if [ -n "$pkg_failed" ]; then
            echo "::error::Typecheck failed for packages:$pkg_failed"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/anymous
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: packages/anymous/coverage
          fail_ci_if_error: false

  build:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run script/build.ts --single --skip-install
        working-directory: packages/anymous
        env:
          # The embedded Web UI vite build exceeds the default Node heap.
          NODE_OPTIONS: --max-old-space-size=6144

  version-check:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json vs CHANGELOG vs bun.lock
        run: |
          pkg=$(node -p "require('./packages/anymous/package.json').version")
          log=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          lock=$(node -e "let t=require('fs').readFileSync('bun.lock','utf8');t=t.replace(/,(?=\s*[}\]])/g,'');const l=JSON.parse(t);console.log((l.workspaces&&l.workspaces['packages/anymous']&&l.workspaces['packages/anymous'].version)||'')")
          echo "package.json=$pkg CHANGELOG=$log bun.lock=$lock"
          if [ "$pkg" != "$log" ] || [ "$pkg" != "$lock" ]; then
            echo "::error::version drift: package.json=$pkg CHANGELOG=$log bun.lock=$lock"
            exit 1
          fi

  publish-check:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run script/prepare-npm.ts
        working-directory: packages/anymous
      - run: npm publish --dry-run --access public
        working-directory: packages/anymous/dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}