name: CI

on:
  push:
    branches: [dev, test-tiny]
  pull_request:
    branches: [dev]

env:
  BUN_VERSION: 1.2.x

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx eslint . --ext .ts,.tsx --max-warnings 0

  typecheck:
    name: Typecheck (focused)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck core packages (focused to avoid OOM)
        run: |
          for pkg in anymous core cli server tui schema protocol script plugin llm codemode sdk js sdk-next; do
            echo "=== Typechecking packages/$pkg ==="
            if [ -f "packages/$pkg/tsconfig.json" ]; then
              bunx --bun tsgo -p packages/$pkg/tsconfig.json --noEmit || echo "Typecheck failed for $pkg (continuing...)"
            fi
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/anymous
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: packages/anymous/coverage
          fail_ci_if_error: false

  build:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run script/build.ts --single --skip-install
        working-directory: packages/anymous

  publish-check:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run script/prepare-npm.ts
        working-directory: packages/anymous
      - run: npm publish --dry-run --access public
        working-directory: packages/anymous/dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}