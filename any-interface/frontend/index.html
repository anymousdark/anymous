<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Any — Interface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', monospace; background: #000; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid #1e3a8a33; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.2rem; letter-spacing: .3em; color: #60a5fa; }
  #status { margin-left: auto; font-size: .75rem; color: #71717a; }
  #status.ok { color: #4ade80; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; font-size: .9rem; line-height: 1.5; }
  .user { align-self: flex-end; background: #1d4ed8; color: #fff; }
  .any { align-self: flex-start; background: #171717; border: 1px solid #1e3a8a33; }
  footer { padding: 14px 20px; border-top: 1px solid #1e3a8a33; display: flex; gap: 10px; align-items: center; }
  #input { flex: 1; background: #0a0a0a; border: 1px solid #1e3a8a55; color: #fff; border-radius: 999px; padding: 12px 20px; font-size: 1rem; outline: none; }
  button { background: #1d4ed8; color: #fff; border: none; border-radius: 999px; padding: 12px 22px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2563eb; }
  #mic.rec { background: #dc2626; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  #agent { background: #0a0a0a; color: #93c5fd; border: 1px solid #1e3a8a55; border-radius: 999px; padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>ANY</h1>
  <select id="agent"><option value="any">any</option></select>
  <span id="status">● a ligar...</span>
</header>
<div id="chat"></div>
<footer>
  <button id="mic" title="Falar (segurar)">🎤</button>
  <input id="input" placeholder="Fala com o Any..." autocomplete="off" />
  <button id="send">➤</button>
</footer>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const micBtn = document.getElementById('mic');
const agentSel = document.getElementById('agent');
const status = document.getElementById('status');

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function ask(text) {
  addMsg(text, 'user');
  input.value = '';
  const r = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text, agent: agentSel.value })
  });
  const { answer } = await r.json();
  addMsg(answer || '(sem resposta)', 'any');
  // fala a resposta
  try {
    const s = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: answer })
    });
    const blob = await s.blob();
    new Audio(URL.createObjectURL(blob)).play();
  } catch {}
}

document.getElementById('send').onclick = () => input.value.trim() && ask(input.value.trim());
input.onkeydown = (e) => { if (e.key === 'Enter' && input.value.trim()) ask(input.value.trim()); };

// mic: grava enquanto prime (push-to-talk)
let recorder, chunks;
async function micStart(e) {
  e.preventDefault();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (ev) => chunks.push(ev.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const fd = new FormData();
    fd.append('audio', blob);
    const r = await fetch('/api/listen', { method: 'POST', body: fd });
    const { text } = await r.json();
    if (text) ask(text);
    else addMsg('(nada ouvido)', 'any');
  };
  recorder.start();
  micBtn.classList.add('rec');
}
function micStop() { recorder && recorder.state !== 'inactive' && recorder.stop(); micBtn.classList.remove('rec'); }
micBtn.onmousedown = micStart;
micBtn.onmouseup = micStop;
micBtn.ontouchstart = micStart;
micBtn.ontouchend = micStop;

// boot
(async () => {
  try {
    const h = await (await fetch('/api/health')).json();
    status.textContent = h.anymous ? '● anymous ligado' : '● anymous desligado';
    status.className = h.anymous ? 'ok' : '';
  } catch { status.textContent = '● sem backend'; }
  try {
    const { agents } = await (await fetch('/api/agents')).json();
    agentSel.innerHTML = agents.map(a => `<option value="${a.name}"${a.name === 'any' ? ' selected' : ''}>${a.name}</option>`).join('');
  } catch {}
  addMsg('Sou o Any. Escreve ou prime o micro para falar.', 'any');
})();
</script>
</body>
</html>
