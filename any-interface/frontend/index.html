<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Any</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #09090b; color: #e4e4e7; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 18px; border-bottom: 1px solid #27272a; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 1.1rem; letter-spacing: .25em; color: #60a5fa; }
  header select { background: #18181b; color: #93c5fd; border: 1px solid #3f3f46; border-radius: 8px; padding: 6px 10px; font-size: .8rem; max-width: 180px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #52525b; margin-left: auto; }
  #dot.ok { background: #4ade80; }
  #dot.err { background: #f87171; }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; font-size: .92rem; line-height: 1.5; }
  .user { align-self: flex-end; background: #1d4ed8; color: #fff; }
  .any { align-self: flex-start; background: #18181b; border: 1px solid #27272a; }
  .sys { align-self: center; color: #71717a; font-size: .78rem; }
  footer { padding: 12px 18px; border-top: 1px solid #27272a; display: flex; gap: 8px; }
  #input { flex: 1; background: #18181b; border: 1px solid #3f3f46; color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 1rem; outline: none; }
  #input:focus { border-color: #3b82f6; }
  button { background: #1d4ed8; color: #fff; border: none; border-radius: 10px; padding: 11px 18px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2563eb; }
  button:disabled { opacity: .4; cursor: default; }
  #mic.rec { background: #dc2626; }
</style>
</head>
<body>
<header>
  <h1>ANY</h1>
  <select id="agent"><option value="any">any</option></select>
  <select id="model"><option value="">modelo…</option></select>
  <select id="project"><option value="">projeto…</option></select>
  <span id="dot" title="estado"></span>
</header>
<div id="chat"></div>
<footer>
  <button id="mic" title="segurar para falar">🎤</button>
  <input id="input" placeholder="Escreve ao Any..." autocomplete="off" />
  <button id="send">➤</button>
</footer>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const micBtn = document.getElementById('mic');
const sendBtn = document.getElementById('send');
const agentSel = document.getElementById('agent');
const modelSel = document.getElementById('model');
const projectSel = document.getElementById('project');
const dot = document.getElementById('dot');
let busy = false, curAudio = null;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function setBusy(b) {
  busy = b;
  sendBtn.disabled = b;
  input.disabled = b;
}
async function speak(text) {
  try {
    if (curAudio) { curAudio.pause(); curAudio = null; }
    const r = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text.slice(0, 500) })
    });
    if (!r.ok) return;
    const blob = await r.blob();
    if (!blob.type.startsWith('audio')) return;
    curAudio = new Audio(URL.createObjectURL(blob));
    await curAudio.play().catch(() => {});
  } catch {}
}
async function ask(text) {
  if (busy) return;
  setBusy(true);
  addMsg(text, 'user');
  input.value = '';
  const t0 = Date.now();
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, agent: agentSel.value, model: modelSel.value || undefined })
    });
    const data = await r.json();
    if (!r.ok || !data.answer) throw new Error(data.error || ('http ' + r.status));
    addMsg(data.answer, 'any');
    addMsg(`resposta em ${((Date.now() - t0) / 1000).toFixed(1)}s`, 'sys');
    dot.className = 'ok';
    speak(data.answer);
  } catch (e) {
    addMsg('Erro no provedor. Tenta de novo em 1 min. (' + String(e.message || e).slice(0, 100) + ')', 'any');
    dot.className = 'err';
  }
  setBusy(false);
}
sendBtn.onclick = () => input.value.trim() && ask(input.value.trim());
input.onkeydown = (e) => { if (e.key === 'Enter' && input.value.trim()) ask(input.value.trim()); };

// mic push-to-talk (pointer único, sem duplicar)
let recorder = null;
async function micDown(e) {
  e.preventDefault();
  if (recorder && recorder.state === 'recording') return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (ev) => chunks.push(ev.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      micBtn.classList.remove('rec');
      try {
        const fd = new FormData();
        fd.append('audio', new Blob(chunks, { type: 'audio/webm' }));
        const r = await fetch('/api/listen', { method: 'POST', body: fd });
        const data = await r.json();
        if (data.text) ask(data.text);
        else addMsg('(nada ouvido)', 'sys');
      } catch { addMsg('(falha no mic)', 'sys'); }
    };
    recorder.start();
    micBtn.classList.add('rec');
  } catch { addMsg('(mic negado)', 'sys'); }
}
function micUp() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  micBtn.classList.remove('rec');
}
micBtn.style.touchAction = 'none';
micBtn.onpointerdown = micDown;
window.onpointerup = micUp;

(async () => {
  try {
    const h = await (await fetch('/api/health')).json();
    dot.className = h.anymous ? 'ok' : 'err';
  } catch { dot.className = 'err'; }
  try {
    const { agents } = await (await fetch('/api/agents')).json();
    agentSel.innerHTML = agents.map(a =>
      `<option value="${a.name}"${a.name === 'any' ? ' selected' : ''}>${a.name}</option>`).join('');
  } catch {}
  try {
    const { models, default: def } = await (await fetch('/api/models')).json();
    modelSel.innerHTML = models.map(m =>
      `<option value="${m.id}"${m.id === def ? ' selected' : ''}>${m.label}</option>`).join('');
  } catch {}
  try {
    const r = await fetch('/api/projects');
    const projects = await r.json();
    if (Array.isArray(projects)) {
      projectSel.innerHTML = '<option value="">todos</option>' + projects.map(p => {
        const label = (p.worktree || p.id || '').split('/').slice(-2).join('/');
        return `<option value="${p.worktree || ''}">${label || p.id}</option>`;
      }).join('');
    }
  } catch {}
  addMsg('Sou o Any. Escreve ou segura o micro.', 'any');
})();
</script>
</body>
</html>
